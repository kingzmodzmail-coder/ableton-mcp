[project]
name = "ableton-mcp"
version = "1.4.0"
description = "Ableton Live integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "supabase>=2.0.0",
    "jsonschema>=4.23,<5",
]

[project.scripts]
ableton-producer = "MCP_Server.producer.cli:main"
ableton-mcp = "MCP_Server.server:main"
ableton-mcp-install-script = "MCP_Server.remote_script_install:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server", "MCP_Server.dataset", "MCP_Server.producer",
            "MCP_Server.producer.ear", "MCP_Server.producer.pipeline",
            "MCP_Server.bundled_ableton_remote_script", "music_ear_contracts"]
package-dir = { "music_ear_contracts" = "packages/contracts/music_ear_contracts" }
# MANIFEST.in governs the sdist; this governs the wheel. Both are needed.
exclude-package-data = { "MCP_Server" = ["config.py"] }

[tool.setuptools.package-data]
"MCP_Server.producer.pipeline" = ["*.yaml"]
"MCP_Server.bundled_ableton_remote_script" = ["AbletonMCP_init.py"]
"music_ear_contracts" = ["schemas/*.json"]

[project.urls]
"Homepage" = "https://github.com/ahujasid/ableton-mcp"
"Bug Tracker" = "https://github.com/ahujasid/ableton-mcp/issues"

[project.optional-dependencies]
producer = ["numpy>=1.26,<3", "soundcard>=0.4.5,<0.5", "PyYAML>=6,<7",
            "pyloudnorm>=0.1.1,<0.2"]
test = ["pytest>=8,<10", "numpy>=1.26,<3", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# On this PC the default temp root (an 8.3 short path under AppData\Local\Temp)
# makes pytest's tmp_path fixture fail with PermissionError; run with
#   pytest --basetemp=_local/pytest-tmp
# if you hit that. See docs/fix-log-2026-09-17.md.
